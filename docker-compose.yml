version: '3.8'

services:
  # Redis сервис
  redis:
    image: redis:7-alpine
    container_name: tg-x-bot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tg-x-bot-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Telegram Bot сервис
  bot:
    build: .
    container_name: tg-x-bot-telegram
    environment:
      - DISPLAY=:99
    volumes:
      - ./config.dev.ini:/app/config.dev.ini:ro
      - ./x_cookies.txt:/app/x_cookies.txt:ro
      - ./userbot_pyrogram.session:/app/userbot_pyrogram.session
      - ./logs:/app/logs
      - ./downloads:/app/downloads
    depends_on:
      - redis
      - n8n
    restart: unless-stopped
    networks:
      - tg-x-bot-network
    command: bash -c "python -m app --mode=dev --client=bot & python -m app --mode=dev --client=xscrapper && wait"

  # n8n сервис
  n8n:
    image: n8nio/n8n:2.14.2
    container_name: tg-x-bot-n8n
    env_file:
      - .env
    ports:
      - "5678:5678"
    environment:
      HTTP_PROXY: http://user239081:6iogl9@130.254.41.43:6663
      HTTPS_PROXY: http://user239081:6iogl9@130.254.41.43:6663
      NO_PROXY: localhost,127.0.0.1,n8n
      NODES_EXCLUDE: "[]"
      N8N_DEFAULT_BINARY_DATA_MODE: ${N8N_DEFAULT_BINARY_DATA_MODE}
      N8N_PAYLOAD_SIZE_MAX: ${N8N_PAYLOAD_SIZE_MAX}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${TZ}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: ${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS}
      N8N_RUNNERS_ENABLED: ${N8N_RUNNERS_ENABLED}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
    volumes:
      - ./init-n8n-workflows:/init-workflows
      - n8n_data:/home/node/.n8n
    networks:
      - tg-x-bot-network
    restart: unless-stopped

volumes:
  redis_data:
  n8n_data:

networks:
  tg-x-bot-network:
    driver: bridge
